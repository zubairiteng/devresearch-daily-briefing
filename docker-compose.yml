version: "3.8"

services:
  devresearch:
    build: .
    container_name: devresearch_briefing
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - TIMEZONE=Asia/Karachi
      - DIGEST_TIME=10:00
      - DATABASE_URL=sqlite:////app/devresearch.db
    env_file:
      - .env
    volumes:
      # Persist SQLite database and configuration changes
      - ./devresearch.db:/app/devresearch.db
      - ./profile.yaml:/app/profile.yaml
      - ./sources.yaml:/app/sources.yaml
