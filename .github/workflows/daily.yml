name: Daily Briefing & Public Mirror

on:
  schedule:
    # 10:00 AM Pakistan Time (Asia/Karachi, UTC+5) = 05:00 UTC
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "daily-briefing"
  cancel-in-progress: false

jobs:
  run-pipeline-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore SQLite State
        run: |
          if [ -f data.db ]; then
            cp data.db devresearch.db
            echo "Restored existing data.db to devresearch.db"
          else
            echo "No existing data.db found; starting fresh database."
          fi

      - name: Run Daily Briefing Pipeline
        id: pipeline_step
        env:
          APP_ENV: production
          TIMEZONE: Asia/Karachi
          DIGEST_TIME: "10:00"
          DATABASE_URL: sqlite:///./devresearch.db
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'heuristic' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAIL_PROVIDER: ${{ secrets.MAIL_PROVIDER || 'smtp' }}
          MAIL_FROM: ${{ secrets.MAIL_FROM || 'DevResearch Daily <daily@devresearch.local>' }}
          MAIL_RECIPIENTS: ${{ secrets.MAIL_RECIPIENTS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: 'true'
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python run_pipeline.py

      - name: Build Sanitized Public Static Dashboard
        run: |
          python scripts/export_static_dashboard.py

      - name: Persist SQLite data.db
        run: |
          cp devresearch.db data.db
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.db
          git diff --staged --quiet || git commit -m "chore: persist data.db after daily briefing [skip ci]"
          git push origin main || echo "No changes or push failed"

      - name: Setup Pages
        id: setup_pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: steps.setup_pages.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.setup_pages.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Notify on Failure
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_RECIPIENTS: ${{ secrets.MAIL_RECIPIENTS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM || 'DevResearch Daily <daily@devresearch.local>' }}
        run: |
          python -c "
          import smtplib
          from email.mime.text import MIMEText
          import os

          user = os.environ.get('SMTP_USER')
          pwd = os.environ.get('SMTP_PASSWORD')
          recip = os.environ.get('MAIL_RECIPIENTS')
          if user and pwd and recip:
              msg = MIMEText('DevResearch Daily Briefing GitHub Actions pipeline failed. Please check GitHub Actions logs.', 'plain')
              msg['Subject'] = 'URGENT: DevResearch GitHub Actions Pipeline Alert'
              msg['From'] = os.environ.get('MAIL_FROM', user)
              msg['To'] = recip
              s = smtplib.SMTP(os.environ.get('SMTP_HOST', 'smtp.gmail.com'), int(os.environ.get('SMTP_PORT', 587)))
              s.starttls()
              s.login(user, pwd)
              s.sendmail(msg['From'], [recip], msg.as_string())
              s.quit()
          "
